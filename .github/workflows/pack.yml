name: pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pack
        run: echo "zip=$(./pack.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: easybones
          path: ${{ steps.pack.outputs.zip }}
