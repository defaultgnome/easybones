name: release

# Manual: Actions > release > Run workflow. Tags v<manifest version> on the chosen
# branch and publishes a GitHub release with the zip. Bump version + CHANGELOG first.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(./pack.sh)
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)
          # Notes = this version's CHANGELOG section
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]")} p && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION"; exit 1; }
          gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
