name: release

# Auto: runs on push to main touching the manifest; releases only if tag v<version> is new.
# Manual: Actions > release > Run workflow on any branch. Bump version + CHANGELOG first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [blender_manifest.toml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)
          # Manifest edited without a version bump -> nothing to release
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          ZIP=$(./pack.sh)
          # Notes = this version's CHANGELOG section
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]")} p && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION"; exit 1; }
          gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
